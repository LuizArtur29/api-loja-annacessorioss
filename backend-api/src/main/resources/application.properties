spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=10000
spring.data.web.pageable.max-page-size=100

server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.admin.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}

# === JWT ===
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:28800000}
