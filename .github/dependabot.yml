version: 2
updates:
  - package-ecosystem: maven
    directory: /backend-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      jjwt-runtime:
        patterns:
          - "io.jsonwebtoken:*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/plugin-react"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
