name: Deploy Production

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify tag belongs to main
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "ERRO: a tag não aponta para um commit presente na main."
            exit 1
          fi

      - name: Wait for tagged images
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for i in {1..30}; do
            BACKEND_OK=false
            FRONTEND_OK=false

            if docker manifest inspect \
              "ghcr.io/luizartur29/ana-acessorios-backend:$VERSION" \
              >/dev/null 2>&1; then
              BACKEND_OK=true
            fi

            if docker manifest inspect \
              "ghcr.io/luizartur29/ana-acessorios-frontend:$VERSION" \
              >/dev/null 2>&1; then
              FRONTEND_OK=true
            fi

            if [[ "$BACKEND_OK" == true && "$FRONTEND_OK" == true ]]; then
              echo "Imagens $VERSION disponíveis."
              exit 0
            fi

            echo "Aguardando imagens $VERSION... tentativa $i/30"
            sleep 10
          done

          echo "ERRO: imagens da release não ficaram disponíveis."
          exit 1

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH OK'"

      - name: Deploy to Lightsail
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
          VERSION: ${{ github.ref_name }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$SSH_USER@$SSH_HOST" \
            "/opt/ana-acessorios/deploy.sh '$VERSION'"